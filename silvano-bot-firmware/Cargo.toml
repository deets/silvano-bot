[package]
edition      = "2024"
name         = "silvano-bot-firmware"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "silvano-bot-firmware"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.0", features = ["esp32s2", "unstable", "log-04"] }
blocking-network-stack = { git = "https://github.com/AlexandreDoucet/blocking-network-stack.git", rev = "9d954f1bd0b1e602b42d62bf1a68a0cf4c6c7209" }

esp-rtos = { version = "0.2.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s2",
] }

esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32s2"] }

embassy-net = { version = "0.7.1", features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.9.0"
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.9.1", features = [] }
embassy-time = "0.5.0"
esp-radio = { version = "0.17.0", features = [
  "esp-alloc",
  "esp32s2",
  "smoltcp",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.12.0", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
esp-backtrace = { version = "0.19.0", features = ["esp32s2", "println", "panic-handler"] }
esp-println = { version = "0.17.0", features = ["esp32s2", "auto", "log-04"] }
edge-dhcp = "0.8.0"
edge-nal = "0.7.0"
edge-nal-embassy = "0.8.1"


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

